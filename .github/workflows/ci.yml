name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Os testes cobrem as partes puras (KDL, cores, layout, markdown, Store,
      # temas embutidos, protobuf, APNG, URLs de mídia) e não precisam de SDL.
      - run: zig build test
      # O gerador de plugin do site contra a API do app: cabeçalho, capacidades, luac e
      # cada plugin gerado rodando num larper de mentira com as regras do app.
      - name: Gerador de plugin do site
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.4
          node tools/test_plugin_starter.js
      # O mínimo comum, como na release: o supressor de ruído escolhe o caminho ao rodar.
      - name: Caminhos do supressor de ruído
        run: |
          zig build test -Dcpu=baseline
          for arch in 0 1 2; do LARPER_RNNOISE_ARCH=$arch zig build ruido-custo -Dcpu=baseline; done

  # O build para Windows sai do Linux (as bibliotecas vêm de tools/windows_deps.sh).
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/windows_deps.sh
      - run: zig build -Dtarget=x86_64-windows-gnu -Dqa=true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-qa-build
          path: zig-out/bin/

  # O QA completo num Windows de verdade (sem GPU, então com folga no tempo).
  windows-qa:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-qa-build
          path: bin
      - name: QA
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SLOW: "3"
        run: |
          New-Item -ItemType Directory -Force qa-out | Out-Null
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\out.txt -RedirectStandardError qa-out\err.txt
          Get-Content qa-out\out.txt,qa-out\err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic' | ForEach-Object { $_.Line }
          exit $p.ExitCode
      - name: FFmpeg button, real download
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SUITE: ffmpeg
        run: |
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\ffmpeg-out.txt -RedirectStandardError qa-out\ffmpeg-err.txt
          Get-Content qa-out\ffmpeg-out.txt,qa-out\ffmpeg-err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic' | ForEach-Object { $_.Line }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-out
          path: qa-out/

  # O app inteiro (UI, rede, imagens) só compila com as bibliotecas do
  # sistema: roda num Arch, que tem SDL3, libwebp e companhia nos pacotes.
  # Depois, o QA completo fora da tela, com os dados de demonstração.
  build-and-qa:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git pkgconf sdl3 curl zlib freetype2 fontconfig libwebp opus noto-fonts noto-fonts-emoji python weston xorg-server-xvfb
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build
      - name: Wayland nativo, escala e fallback X11
        run: python3 tools/qa_wayland.py zig-out/bin/larpercord
      - run: ./tools/qa.sh
        env:
          SDL_VIDEO_DRIVER: offscreen
          QA_SLOW: "3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-qa-out
          path: qa-out/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out/

  # macOS (experimental, Apple Silicon): as bibliotecas do Homebrew (docs/macos.md), os
  # testes, a bateria geral do QA fora da tela e o .app para quem tem um Mac baixar e
  # testar. Enquanto o port for experimental, uma falha aqui não segura o resto.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: brew install sdl3 curl opus webp freetype fontconfig openssl@3 pkgconf
      - run: sh tools/macos_build.sh
      - run: zig build test
      # Debug, com as checagens de segurança, como o tools/qa.sh. Sem janela: o driver
      # offscreen do SDL desenha no renderizador de software (o Metal precisa de janela).
      - name: QA geral (fora da tela)
        env:
          SDL_VIDEO_DRIVER: offscreen
          LARPER_RENDERER: software
          QA_SLOW: "3"
        run: |
          sh tools/macos_build.sh -Doptimize=debug -p .zig-cache/qa
          mkdir -p qa-out
          status=0
          ./.zig-cache/qa/bin/larpercord --qa --theme classico > qa-out/geral.log 2>&1 || status=$?
          grep -E 'passaram|falharam|^\s+- \[|panic' qa-out/geral.log || tail -n 30 qa-out/geral.log
          exit $status
      # O .app com as dylibs dentro, assinado ad hoc. Em .tar.gz: o artefato do GitHub
      # perde a permissão de execução dos arquivos.
      - name: Pacote .app
        if: always()
        run: |
          rm -rf dist && mkdir dist
          python3 tools/macos_bundle.py dist/LarperCord.app
          tar -czf dist/larpercord-macos-arm64.tar.gz -C dist LarperCord.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: larpercord-macos-arm64
          path: dist/larpercord-macos-arm64.tar.gz
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-qa-out
          path: qa-out/
          if-no-files-found: ignore

  # O site: cada tema de themes/community/ com as regras do app e da galeria (metadados,
  # nome único, sem cópia de tema embutido) e o teste do criador de temas, que carrega cada
  # um como o app. Um tema quebrado num pull request falha aqui, antes de chegar ao Pages.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 tools/gen_site.py --check-community
      - run: node tools/theme_builder_test.js
