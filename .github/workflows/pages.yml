name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "themes/**"
      - "tools/gen_site.py"
      - "src/ui/atalhos.zig"
      - "src/ui/plugins_page.zig"
      - "src/plugins/manifest.zig"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Só biblioteca padrão. Regenera aqui para o site nunca ficar atrás dos temas e guias.
      - run: python3 tools/gen_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
