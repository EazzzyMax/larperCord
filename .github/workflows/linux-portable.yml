name: linux-portable
# Os arquivos das releases. O de Linux é compilado num Ubuntu antigo, porque é a
# glibc de onde ele nasce que decide em quais distros ele abre, e aberto em várias
# antes de valer. O de Windows (o .exe, as DLLs e o zip) sai daqui também, para
# nada da release ser compilado na máquina de quem publica. O atestado prova que
# cada arquivo saiu deste código.
on:
  workflow_dispatch:
  push:
    branches: [main, "portable/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Ferramentas e cabeçalhos
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils make gcc g++ cmake ninja-build pkg-config binutils \
            perl zlib1g-dev libfreetype-dev libfontconfig1-dev libwebp-dev libopus-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libwayland-bin libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev
          apt-get install -y --no-install-recommends python3 weston xvfb fonts-dejavu-core
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/linux_deps.sh
      - name: Compilar
        run: PKG_CONFIG_PATH=$PWD/.deps/linux/lib/pkgconfig zig build -Dcpu=baseline -Dportable=true
      - name: Wayland nativo no binário portátil
        run: python3 tools/qa_wayland.py zig-out/bin/larpercord
      - name: O que o binário exige
        run: |
          bin=zig-out/bin/larpercord
          ls -l "$bin"
          objdump -p "$bin" | grep NEEDED
          max=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k2 -n | uniq | tail -1)
          echo "glibc exigida: $max"
          [ "${max#GLIBC_2.}" -le 35 ]
          if objdump -p "$bin" | grep -qE 'NEEDED +lib(SDL3|curl|ssl|crypto)'; then echo "SDL3, curl e OpenSSL deviam estar dentro"; exit 1; fi
          # Símbolo exportado não sai do binário: o OpenSSL não pode voltar para a tabela dinâmica.
          n=$(nm -D --defined-only "$bin" | wc -l); echo "símbolos exportados: $n"; [ "$n" -le 50 ]
      - uses: actions/upload-artifact@v4
        with:
          name: larpercord-linux-x86_64
          path: zig-out/bin/larpercord
          if-no-files-found: error

  # O de Windows das releases: as bibliotecas com versão e hash fixos (tools/windows_deps.sh)
  # e o mesmo build do job windows do ci.yml, sem o QA dentro. O .exe não abre sem as DLLs:
  # quem baixa pelo site recebe o zip com tudo junto.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/windows_deps.sh
      - name: Compilar
        run: zig build -Dtarget=x86_64-windows-gnu -p out/win
      - name: O .exe, as DLLs e o zip
        run: |
          mkdir -p rel/larperCord
          cp out/win/bin/larpercord.exe rel/larpercord-windows-x86_64.exe
          cp out/win/bin/*.dll rel/
          cp out/win/bin/larpercord.exe out/win/bin/*.dll rel/larperCord/
          (cd rel && zip -qr larpercord-windows-x86_64.zip larperCord && rm -r larperCord)
          for f in larpercord-windows-x86_64.exe larpercord-windows-x86_64.zip SDL3.dll libcurl-x64.dll libcrypto-3-x64.dll; do test -s "rel/$f"; done
          ls -l rel
      - uses: actions/upload-artifact@v4
        with:
          name: larpercord-windows-x86_64
          path: rel/
          if-no-files-found: error

  # Abre de verdade: sem GPU, só com as bibliotecas que um desktop dessas distros já tem.
  test:
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", install: "apt-get update && apt-get install -y --no-install-recommends ca-certificates libfreetype6 libfontconfig1 libwebp7 libwebpdemux2 libopus0 zlib1g fonts-dejavu-core" }
          - { image: "ubuntu:24.04", install: "apt-get update && apt-get install -y --no-install-recommends ca-certificates libfreetype6 libfontconfig1 libwebp7 libwebpdemux2 libopus0 zlib1g fonts-dejavu-core" }
          - { image: "debian:12", install: "apt-get update && apt-get install -y --no-install-recommends ca-certificates libfreetype6 libfontconfig1 libwebp7 libwebpdemux2 libopus0 zlib1g fonts-dejavu-core" }
          - { image: "debian:13", install: "apt-get update && apt-get install -y --no-install-recommends ca-certificates libfreetype6 libfontconfig1 libwebp7 libwebpdemux2 libopus0 zlib1g fonts-dejavu-core" }
          - { image: "fedora:latest", install: "dnf install -y ca-certificates freetype fontconfig libwebp opus zlib-ng-compat dejavu-sans-fonts" }
          - { image: "opensuse/tumbleweed", install: "zypper -n install ca-certificates ca-certificates-mozilla libfreetype6 fontconfig libwebp7 libwebpdemux2 libopus0 libz1 dejavu-fonts tar gzip" }
          - { image: "archlinux:latest", install: "pacman -Syu --noconfirm --needed ca-certificates freetype2 fontconfig libwebp opus zlib ttf-dejavu" }
    steps:
      - name: Bibliotecas do sistema
        run: ${{ matrix.install }}
      - uses: actions/download-artifact@v4
        with:
          name: larpercord-linux-x86_64
      - name: Abrir na demonstração e conferir o TLS
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          LARPER_RENDERER: software
          HOME: /tmp/home
        run: |
          mkdir -p "$HOME"
          chmod +x larpercord
          ./larpercord --help > /dev/null
          ./larpercord --demo --shot /tmp/demo.png
          test "$(stat -c %s /tmp/demo.png)" -gt 10000
          # O mesmo curl do app, com os certificados desta distro. Nunca no Discord.
          ./larpercord --tls-check https://github.com/

  attest:
    needs: [test, windows]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: larpercord-linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: larpercord-windows-x86_64
          path: windows
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            larpercord
            windows/*
